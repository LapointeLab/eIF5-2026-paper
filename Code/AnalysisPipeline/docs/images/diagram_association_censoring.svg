<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#1f4e79">Figure B — Exposure blending at binding onset (start of event)</text>

  <!-- ===== Case 1: binds EARLY in the exposure -> reliable ===== -->
  <text x="235" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Case 1 — binds early in the exposure</text>
  <text x="235" y="70" text-anchor="middle" font-size="12" fill="#1a1a1a">(1 ms unbound / 20 ms — reliable)</text>

  <text x="235" y="98" text-anchor="middle" font-size="10.5" fill="#555">one 20 ms exposure = one recorded frame</text>
  <line x1="175" y1="104" x2="295" y2="104" stroke="#888" stroke-width="1"/>
  <line x1="175" y1="99" x2="175" y2="104" stroke="#888" stroke-width="1"/>
  <line x1="295" y1="99" x2="295" y2="104" stroke="#888" stroke-width="1"/>

  <!-- block1: unbound -->
  <rect x="40" y="110" width="120" height="50" fill="#e3e6ea"/>
  <text x="100" y="139" text-anchor="middle" font-size="11" fill="#555">unbound</text>
  <!-- block2 (first ON frame): 5% gray (left, 1ms) + 95% blue (right, 19ms) -->
  <rect x="175" y="110" width="6" height="50" fill="#e3e6ea"/>
  <rect x="181" y="110" width="114" height="50" fill="#0d4f8b" opacity="0.85"/>
  <rect x="175" y="110" width="120" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- block3: bound, clean -->
  <rect x="310" y="110" width="120" height="50" fill="#0d4f8b" opacity="0.85"/>
  <text x="370" y="139" text-anchor="middle" font-size="11" fill="#fff">bound (Frame 2, clean)</text>

  <text x="235" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">First ON frame</text>
  <text x="235" y="192" text-anchor="middle" font-size="10" fill="#555">1 ms unbound (5%) + 19 ms bound (95%)</text>
  <text x="235" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#1f7a3d">✓ reading ≈ true bound FRET (reliable)</text>

  <!-- divider -->
  <line x1="450" y1="45" x2="450" y2="290" stroke="#d5dae1" stroke-width="1"/>

  <!-- ===== Case 2: binds LATE in the exposure -> unreliable ===== -->
  <text x="665" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Case 2 — binds late in the exposure</text>
  <text x="665" y="70" text-anchor="middle" font-size="12" fill="#1a1a1a">(15 ms unbound / 20 ms — unreliable)</text>

  <text x="665" y="98" text-anchor="middle" font-size="10.5" fill="#555">one 20 ms exposure = one recorded frame</text>
  <line x1="605" y1="104" x2="725" y2="104" stroke="#888" stroke-width="1"/>
  <line x1="605" y1="99" x2="605" y2="104" stroke="#888" stroke-width="1"/>
  <line x1="725" y1="99" x2="725" y2="104" stroke="#888" stroke-width="1"/>

  <rect x="470" y="110" width="120" height="50" fill="#e3e6ea"/>
  <text x="530" y="139" text-anchor="middle" font-size="11" fill="#555">unbound</text>
  <!-- block2: 75% gray (left, 15ms) + 25% blue (right, 5ms) -->
  <rect x="605" y="110" width="90" height="50" fill="#e3e6ea"/>
  <rect x="695" y="110" width="30" height="50" fill="#0d4f8b" opacity="0.85"/>
  <rect x="605" y="110" width="120" height="50" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="740" y="110" width="120" height="50" fill="#0d4f8b" opacity="0.85"/>
  <text x="800" y="139" text-anchor="middle" font-size="11" fill="#fff">bound (Frame 2, clean)</text>

  <text x="665" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">First ON frame</text>
  <text x="665" y="192" text-anchor="middle" font-size="10" fill="#555">15 ms unbound (75%) + 5 ms bound (25%)</text>
  <text x="665" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#c0392b">✗ reading ≈ baseline, NOT representative</text>

  <text x="450" y="255" text-anchor="middle" font-size="12" fill="#333">Both cases show the SAME nominal "first ON frame" — its reliability depends entirely on</text>
  <text x="450" y="272" text-anchor="middle" font-size="12" fill="#333">where within that one exposure window binding actually fell, which the recording never captures.</text>
</svg>
